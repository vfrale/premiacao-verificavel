[project]
name = "premiacao-verificavel"
version = "0.1.0"
description = "Protótipo de mecanismo de premiação verificável (protocolo provably fair com HMAC-SHA256), verificador independente e experimentos do TCC"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[project.optional-dependencies]
testes = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
